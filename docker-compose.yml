# dorsadesign.ir/docker-compose.yml
services:

  postgres:
    image: postgres:15-alpine
    container_name: dorsadesign_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - external-net
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_PORT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorsa -d dorsadesign"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: dorsadesign-backend:${IMAGE_TAG}
    container_name: dorsadesign-backend
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    environment:
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
      - POSTGRES_DB
      - SECRET_KEY
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - REFRESH_TOKEN_EXPIRE_DAYS
      - CORS_ORIGINS
      - ALLOWED_HOSTS
      - DEBUG
      - UPLOAD_DIR
      - MAX_UPLOAD_SIZE
      - ALLOWED_EXTENSIONS
      - LOG_LEVEL
      - LOG_FILE
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - external-net

  frontend:
    image: dorsadesign-frontend:${IMAGE_TAG}
    container_name: dorsadesign-frontend
    restart: unless-stopped
    networks:
      - external-net

volumes:
  postgres_data:
    name: dorsadesign_postgres_data
  uploads_data:
    name: dorsadesign_uploads_data
  logs_data:
    name: dorsadesign_logs_data

networks:
  external-net:
    external: true
    name: external-net