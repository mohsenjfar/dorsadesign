# dorsadesign.ir/docker-compose.yml
services:

  # ============================================
  # 📦 PostgreSQL
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: dorsadesign_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - external-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 🚀 Application
  # ============================================
  app:
    image: dorsadesign:${IMAGE_TAG}
    container_name: dorsadesign-app
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    environment:
      - DATABASE_URL
      - SECRET_KEY
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - REFRESH_TOKEN_EXPIRE_DAYS
      - CORS_ORIGINS
      - ALLOWED_HOSTS
      - DEBUG
      - UPLOAD_DIR
      - MAX_UPLOAD_SIZE
      - ALLOWED_EXTENSIONS
      - LOG_LEVEL
      - LOG_FILE
      - FRONTEND_URL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - external-net


networks:
  external-net:
    external: true
    name: external-net


volumes:
  postgres_data:
    name: dorsadesign_postgres_data
  uploads_data:
    name: dorsadesign_uploads_data
  logs_data:
    name: dorsadesign_logs_data