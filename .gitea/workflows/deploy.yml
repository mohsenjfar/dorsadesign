name: Deploy dorsadesign

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: dorsadesign

    env:
      BRANCH: ${{ github.ref_name }}

      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

      # POSTGRES(Supabase)
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || 30 }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS || 7 }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      DEBUG: ${{ vars.DEBUG || 'False' }}
      MAX_UPLOAD_SIZE: ${{ vars.MAX_UPLOAD_SIZE || 10485760 }}
      ALLOWED_EXTENSIONS: ${{ vars.ALLOWED_EXTENSIONS || '.jpg,.jpeg,.png,.webp,.gif' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      LOG_FILE: ${{ vars.LOG_FILE || './logs/app.log' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://dorsadesign.ir' }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@dorsadesign.ir' }}
      ADMIN_FULL_NAME: ${{ vars.ADMIN_FULL_NAME || 'Admin User' }}

    steps:
      - name: 1️⃣ Checkout Source
        shell: bash
        run: |
          set -e
          REPO_URL="ssh://git@87.248.139.251:2222/ARACOM/dorsadesign.ir.git"

          rm -rf repo
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" repo

      - name: 2️⃣ Set Image Tag
        shell: bash
        run: |
          set -e
          echo "IMAGE_TAG=prod" >> $GITHUB_ENV

      - name: 3️⃣ Build Backend Image
        shell: bash
        run: |
          set -e
          cd repo
          docker build \
            --build-arg PIP_INDEX_URL="${PIP_INDEX_URL}" \
            -f Dockerfile.backend \
            -t dorsadesign-backend:$IMAGE_TAG .

      - name: 4️⃣ Build Frontend Image
        shell: bash
        run: |
          set -e
          cd repo
          docker build \
            --build-arg NPM_REGISTRY="${NPM_REGISTRY}" \
            --build-arg VITE_API_URL="${VITE_API_URL}" \
            -f Dockerfile.frontend \
            -t dorsadesign-frontend:$IMAGE_TAG .

      - name: 5️⃣ Start Services
        shell: bash
        run: |
          set -e
          cd repo
          docker compose down
          docker compose up -d --build
      
      - name: 6️⃣ Cleanup Workspace
        shell: bash
        run: |
          set -e
          cd repo
          git clean -fdx || true